[package]
name = "whisker"
version = "0.1.0"
edition.workspace = true
default-run = "whisker"

[lints]
workspace = true

[dependencies]
clap.workspace = true
paste = "1.0.15"
gdbstub = "0.7.3"
gdbstub_arch = "0.3.1"

# has better hash algorithm for basic numbers
rustc-hash = "2.1.1"
parking_lot = "0.12"

tracing.workspace = true
tracing-subscriber.workspace = true
num-conv = "0.1.0"
elfie.path = "../elfie"
bitflags = "2.9.1"
crossterm = "0.29.0"
socketpair = "0.19.8"
bytemuck = { version = "1.23.1", features = ["derive"] }

bitfield = { path = "../bitfield" }
spin = "0.10.0"

softfloat_pure = { git = "https://github.com/whisker-emu/softfloat-pure.git" }
clap-num = "1.2.0"

iee-754-2019 = { path = "../iee-754-2019" }

[target.'cfg(unix)'.dependencies]
command-fds = "0.3.2"

[features]
tracing = []
